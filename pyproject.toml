[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "truepulse"
version = "0.1.0"
description = "Experimental rPPG-based deepfake-detection research prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Dependencies are pinned in requirements.txt (generated from requirements.in);
# install with:  pip install -r requirements.txt
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
